name: hybrid_susfs Builder

# Satu tombol untuk build dari Utama (meniru Cogan Kernel Builder, gaya repo ini): build.sh mengambil
# mesin simonpunk terbaru, menjalankan gate mesin, lalu mengemas ZIP. Versi dari module/module.prop;
# update.json dan CHANGELOG.md harus sudah sama di commit yang dibangun (build.sh berhenti bila tidak).
# CI = artifact saja (untuk uji HP), lalu terbitkan lewat "Rilis dari run". Pre-Release/Release langsung
# terbit dari run ini. Artifact disimpan 90 hari.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "CI = artifact saja / artifact only; Pre-Release atau / or Release (Release = Latest)"
        type: choice
        default: "CI"
        options:
          - "CI"
          - "Pre-Release"
          - "Release"
      diuji_di_hp:
        description: "Pre-Release/Release: versi ini sudah diuji owner di HP / tested by the owner on the phone"
        type: boolean
        default: false
      engine_commit:
        description: "Opsional: commit engine simonpunk (kosong = terbaru; isi hash untuk mundur ke engine yang terbukti) / optional simonpunk engine commit (empty = latest)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hybrid-susfs-builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ inputs.release_type }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Cek branch / check the branch
        run: |
          [ "$GITHUB_REF" = refs/heads/Utama ] || { echo "::error::Builder hanya dari branch Utama / only from the Utama branch"; exit 1; }

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build (mesin simonpunk + gate) / build (simonpunk engine + gate)
        env:
          ENGINE_COMMIT: ${{ inputs.engine_commit }}
        run: NDK="$ANDROID_NDK_LATEST_HOME" ./build.sh

      - name: Info build / build info
        id: info
        run: |
          set -euo pipefail
          . out/build.env
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir info && cp out/build.env info/build.env
          {
            echo "## hybrid_susfs $VERSION"
            echo "| | |"
            echo "|---|---|"
            echo "| Jenis / type | ${{ inputs.release_type }} |"
            echo "| SUSFS | $SUSFS |"
            echo "| SHA256 | \`$SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Info saja: status pembaruan SideX/Brene (commit yang dicatat di tidak_diupdate.md tampil
      # "dilewati", bukan "baru"). Tidak pernah menghentikan build, termasuk bila hulu gagal diambil.
      - name: Status hulu / upstream status
        continue-on-error: true
        run: |
          {
            echo "### Status hulu / upstream status"
            echo
            echo "- 🇮🇩 Info saja, tidak menghentikan build. Commit yang sengaja tidak diambil dicatat di \`tidak_diupdate.md\` dan tampil ⏭️."
            echo "- 🇬🇧 Info only, never stops the build. Deliberately skipped commits are recorded in \`tidak_diupdate.md\` and shown as ⏭️."
            echo
            echo '```'
            tools/check_updates.sh 2>&1 || echo "(gagal mengambil hulu / failed to fetch upstream)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          path: out/hybrid_susfs_*.zip
          archive: false
          retention-days: 90

      # Tanda tangan digital: siapa pun bisa membuktikan ZIP ini dibangun repo ini (docs/keaslian-dan-kredit.md).
      - name: Tanda tangan / sign the ZIP
        uses: actions/attest@v4.2.2
        with:
          subject-path: out/hybrid_susfs_*.zip

      - name: Upload build info
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-info
          path: info/build.env
          retention-days: 90

  release:
    name: Terbit / publish
    needs: build
    if: ${{ inputs.release_type != 'CI' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      TESTED: ${{ inputs.diuji_di_hp }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: hybrid_susfs_*.zip
          path: files
          merge-multiple: true
          skip-decompress: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-info
          path: info
      - name: Terbitkan / publish
        run: |
          set -euo pipefail
          # Release (Latest) wajib sudah diuji di HP (aturan repo); Pre-Release boleh belum diuji
          if [ "$RELEASE_TYPE" = "Release" ] && [ "$TESTED" != "true" ]; then
            echo "::error::Release (Latest) wajib diuji di HP: centang diuji_di_hp, atau pakai Pre-Release / Release requires a phone test; tick diuji_di_hp or use Pre-Release"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Rilis $VERSION sudah ada. Naikkan versi di module.prop, update.json dan CHANGELOG.md / release exists, bump the version"
            exit 1
          fi
          zip="files/hybrid_susfs_$VERSION.zip"
          sha="$(sed -n "s/^SHA256='\(.*\)'\$/\1/p" info/build.env)"
          [ "$(sha256sum "$zip" | cut -d' ' -f1)" = "$sha" ] || { echo "::error::SHA256 ZIP berbeda / ZIP SHA256 differs"; exit 1; }
          tools/release_notes.sh info/build.env "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$TESTED" > notes.md
          mode=(--prerelease); [ "$RELEASE_TYPE" = "Release" ] && mode=(--latest)
          gh release create "$VERSION" "$zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${mode[@]}" \
            --title "hybrid_susfs $VERSION" --notes-file notes.md
          {
            echo "## Terbit / published"
            echo "- 🇮🇩 Terbit: [$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION) ($RELEASE_TYPE)"
            echo "- 🇬🇧 Published: [$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION) ($RELEASE_TYPE)"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Ringkasan bila gagal / summary on failure
    needs: [build, release]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          {
            echo "## ❌ hybrid_susfs Builder gagal / failed"
            echo
            echo "- 🇮🇩 Tidak ada rilis yang diterbitkan. Alasannya ada di pesan error (langkah merah pertama). Builder hanya jalan dari branch Utama."
            echo "- 🇬🇧 No release was published. The reason is in the error message (the first red step). The Builder only runs from the Utama branch."
          } >> "$GITHUB_STEP_SUMMARY"
