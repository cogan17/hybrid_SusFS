name: Rilis hybrid_susfs

# Tombol manual: build dari main, lalu terbitkan rilis vX.Y dengan ZIP.
# Versi diambil dari module/module.prop; update.json dan CHANGELOG.md harus sudah diperbarui di commit yang sama.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build (mesin simonpunk terbaru + gate)
        run: NDK="$ANDROID_NDK_LATEST_HOME" ./build.sh

      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . out/build.env
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GAGAL: rilis $VERSION sudah ada. Naikkan versi di module.prop, update.json dan CHANGELOG.md."
            exit 1
          fi
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n- SUSFS: %s\n- SHA256: `%s`\n' "$SUSFS" "$SHA256" >> notes.md
          gh release create "$VERSION" "$ZIP" --title "hybrid_susfs $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Ringkasan
        run: |
          . out/build.env
          {
            echo "## hybrid_susfs $VERSION"
            echo "| | |"
            echo "|---|---|"
            echo "| Rilis / Release | ✅ $VERSION |"
            echo "| SUSFS | $SUSFS |"
            echo "| SHA256 | \`$SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"
